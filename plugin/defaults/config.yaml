# The defaults of the coding-agent-kanban-turns plugin: every setting it
# reads, with the value it uses when no file of yours sets it.
#
# The plugin reads this file from its own folder each session, and nothing
# else holds these values. To change a setting, write only that key in
# your own file, $XDG_CONFIG_HOME/coding-agent-kanban-turns/config.yaml
# (~/.config/coding-agent-kanban-turns/config.yaml when XDG_CONFIG_HOME
# is unset), such as
#
#   keys:
#     help: o
#
# Both files are YAML 1.2, read under its core schema: `on` and `yes` are
# strings, a key written twice refuses the file, and quoting a value keeps
# it a string. Sections merge key by key, so every key you leave out comes
# from here and follows this file as it changes. A key that's no setting
# here, or a value of the wrong type, refuses your whole file: the plugin
# uses these defaults and says why in the pane and in /answers-config,
# which lists every setting in effect and the file it came from. Your
# own file is `config.yaml`; no other name is read.

# The count line above the prompt, such as `📌 Outstanding: 🚧 2 · 🧠 3`,
# which the plugin works out from this session's transcript.
counts:
  # How many of the latest turns it reads the open items from, as the
  # kanban skill's `outstanding.py render --counts` does; never further
  # back than the latest `reassess` turn, whose lists replace the rest.
  # 0 or less reads every turn since that `reassess` turn, or since the
  # session began when there is none.
  turns: 20
  # How long the one `gh api graphql` call that asks which of the Review
  # items' pull requests merged may take, in milliseconds. A `gh` that
  # takes longer, fails or is missing settles no Review item.
  gh-timeout-ms: 20000

# The pane's keys, pressed while the pane holds the keyboard (as it
# opens from /answers or the line above the prompt, or after a click).
# Each is one lowercase letter or one digit, the only keys the engine
# takes. A button draws no hint of its key, such as `[ 📤 Submit ]`; the
# panel `? Keys` opens lists them. Options take no key of their own. The
# pane has no close key of its own: Claude Code's ctrl+x x and Escape
# close it, as its close mark in the pane's top right does.
keys:
  # ↓ Next: move the focus ring to the next item, or header.
  next: j
  # ↑ Previous: move the focus ring to the item before.
  previous: k
  # 📤 Submit: send the draft.
  submit: s
  # 🔄 Reassess: add the `reassess` line to the draft, or take it out.
  reassess: r
  # ? Keys: open the panel under the pane's header that lists every
  # key and what it does, or close it. `?` itself can't be one: the
  # engine takes only a lowercase letter or a digit.
  help: h

# The pane itself.
pane:
  # Whether 📤 Submit closes the pane once, counting the answers it
  # sends, no item is left open. A Submit the engine refuses, or that
  # sends nothing, leaves it open; so does false.
  close-when-all-submitted: true

# The ✏️ notes field under each open item in the pane.
notes:
  # How many lines tall the field is, so a long note wraps inside it
  # and stays in sight; a longer one scrolls within. Less than 1 is
  # drawn as 1.
  rows: 3

# The buttons an item's box carries: the one every list's open item has
# under a reply, then each list's own, each named by the word it writes
# after the item's reference, `9efb08a1.Todo.3: done`, which settles the
# item; a second press takes the word out again. The words are the
# protocol's, so only what each button says is a setting.
actions:
  # The button under a reply, in place of the pane's notes field, which
  # opens the pane at that field; it writes nothing itself.
  note:
    # The button's text, after `marks.note`.
    label: Add a note
  # A 👉 Todo item's buttons.
  todo:
    # The item done.
    done:
      # The button's text.
      label: Done
      # What the item's Done row says once the word settled it, such as
      # `Done: done`.
      settled: done
    # The item not to be done.
    skip:
      # The button's text.
      label: Skip
      # What the item's Done row says, such as `Done: skipped`.
      settled: skipped

# The marks the pane draws, each a short string, such as an emoji or one
# character, drawn as it is on one line: an empty one, or one holding a
# control character or a line break, refuses your file. Quote a mark YAML
# would read as something else, such as ">" or "-". An option's mark is
# padded to the widest of `chosen`, `sent` and its item's glyphs, and a
# toggle's, each branch's header and each turn's, to the wider of
# `collapsed` and `expanded`, so a pick or a toggle moves no text.
marks:
  # A Done item's options that the answer which made it Done picked,
  # drawn at full strength in the dimmed item, with no underline, beside
  # its letter: the draft's own picks keep `chosen` underlined. The same
  # as `chosen`, so an answered option reads as a picked one; ☑️, which
  # common terminals draw grey, sets it apart.
  sent: ✅
  # An option the draft picks, in place of its glyph beside its letter,
  # the option's line underlined; also the glyph of 🔄 Reassess while the
  # draft ends on the `reassess` line.
  chosen: ✅
  # The label of the notes field under each open item in the pane, the
  # glyph of the ✏️ Add a note button under a reply, and what opens the
  # count of picks above the prompt, `✏️ 2 picked`.
  note: ✏️
  # The bar that opens a Done item's line under the Done branch, drawn
  # in colors.settled.
  settled-bar: ▌
  # What opens a toggle while what it folds is collapsed: a branch's
  # header, such as `▸ Done (2)`, or a turn's, such as
  # `▸ ── 9efb08a1 ₋₂ (2) ──`.
  collapsed: ▸
  # What opens a toggle while what it folds is expanded, such as
  # `▾ Open (3)`.
  expanded: ▾
  # The glyph each of the pane's buttons is drawn with, before its label,
  # and beside its key in the panel ? Keys opens; a keyed button's by the
  # name of its key in `keys`.
  buttons:
    # ↓ Next.
    next: ↓
    # ↑ Previous.
    previous: ↑
    # 📤 Submit.
    submit: 📤
    # 🔄 Reassess, while the draft doesn't end on the `reassess` line.
    reassess: 🔄
    # ? Keys. Quoted, since YAML reads a bare `?` as the start of a key.
    help: "?"
    # 🖥️ Kanban, above the prompt and atop the pane, which opens the pane.
    kanban: 🖥️

# The colours each part is drawn in, by the name of a colour in Claude
# Code's theme, so each keeps its contrast in light and dark themes.
colors:
  # The rounded border round an item.
  border: promptBorder
  # The label that opens an item's title line, `🧠 Decide.1`, drawn bold
  # on title-background; the summary after it is plain text.
  title-label: inverseText
  # The background of that label, while the item is open; a Done item's
  # label is dimmed, on no background.
  title-background: claude
  # Code spans in a summary, note or option.
  code: permission
  # The bar in the column left of an option, lit down the option's
  # full height while the pointer is over any of its lines.
  hover: suggestion
  # The bar in the same column beside each of a Done item's option, ➕
  # and ➖ lines, which stays lit, and marks.settled-bar, which opens a
  # Done item's line under the Done branch; a Done item lights no
  # hover bar.
  settled: ide
  # The word Kanban in 🖥️ Kanban, above the prompt and atop the pane.
  kanban: claude

# The draft of the full 📌 roll-up the `kanban_outstanding` tool gives.
roll-up:
  # How long an item's summary may be, a whole number of Unicode code
  # points, a Markdown link counting its label alone, as the kanban
  # skill's `outstanding.py --width` counts them; a longer one is cut,
  # ending on `…`, a link kept whole. 0 or less keeps summaries whole.
  summary-width: 100

# The reply lint, which checks a final response's layout: its separator
# lines, its summary lines, its Decide options, its underlines and where
# its tables go. The `kanban_lint` tool lints a draft whatever this says.
lint:
  # Whether the plugin lints each final response as its turn ends: what
  # it finds shows beneath the response, and reaches the agent with the
  # next prompt in the same conversation. false lints only the drafts the
  # agent hands `kanban_lint`.
  turn-end: true
