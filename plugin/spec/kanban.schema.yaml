# The shape of kanban.yaml, as a JSON Schema (draft-07) written in YAML.
# tools/spec/compile.ts checks the spec against it before writing anything;
# kanban.yaml's comments say what each key means.
$schema: http://json-schema.org/draft-07/schema#
title: The kanban turn-response protocol's checkable rules
type: object
additionalProperties: false
required:
  [
    lists,
    options,
    commands,
    skill,
    reference,
    frees,
    subject,
    roll-up,
    tag,
    characters,
  ]
definitions:
  # One character or emoji, never blank.
  glyph:
    type: string
    minLength: 1
    pattern: ^\S+$
  # A list's name: capitalised words, so it reads as a header and in a
  # reference, and needs no escaping in a pattern.
  name:
    type: string
    pattern: ^[A-Z][a-z]+( [a-z]+)*$
  # A lowercase word: a command's name or a settling word.
  word:
    type: string
    pattern: ^[a-z]+$
  # A skill's or a slash command's name.
  slug:
    type: string
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
  # One capital letter.
  letter:
    type: string
    pattern: ^[A-Z]$
  list:
    type: object
    additionalProperties: false
    required:
      [header, glyph, rolls-up, settled-by, settling-words, feedback]
    properties:
      header: { $ref: "#/definitions/name" }
      glyph: { $ref: "#/definitions/glyph" }
      rolls-up: { type: boolean }
      # Each way has its settler in src/items/outstanding.ts's SETTLERS.
      settled-by: { enum: [answer, merged-pull-request, report, settling-word, none] }
      settling-words:
        type: object
        propertyNames: { $ref: "#/definitions/word" }
        additionalProperties: { type: string, minLength: 1 }
      # Each feedback has an entry in every table keyed by it: READERS and
      # SETTLING in src/items/answers.ts, SENDING in src/items/raised.ts,
      # NOTE_PLACEHOLDERS in src/pane/view.ts and ANSWER_VIEWS in
      # hooks/register.tsx.
      feedback: { enum: [options, settling-words, none] }
  kind:
    type: object
    additionalProperties: false
    required: [picks, glyph]
    properties:
      picks: { enum: [one, any] }
      glyph: { $ref: "#/definitions/glyph" }
  command:
    type: object
    additionalProperties: false
    required: [synonyms, from-last-line]
    properties:
      synonyms:
        type: array
        items: { $ref: "#/definitions/word" }
        uniqueItems: true
      from-last-line: { type: boolean }
properties:
  # The JSON copy's header, naming the file it's generated from.
  $comment: { type: string }
  lists:
    type: object
    propertyNames: { $ref: "#/definitions/word" }
    additionalProperties: { $ref: "#/definitions/list" }
    required: [decide]
  options:
    type: object
    additionalProperties: false
    required: [pro, con, kinds]
    properties:
      pro: { $ref: "#/definitions/glyph" }
      con: { $ref: "#/definitions/glyph" }
      kinds:
        type: object
        additionalProperties: false
        required: [radio, checkbox]
        properties:
          radio: { $ref: "#/definitions/kind" }
          checkbox: { $ref: "#/definitions/kind" }
  commands:
    type: object
    additionalProperties: false
    required: [names, unique-prefix-runs, trailing-punctuation, skill-commands]
    properties:
      names:
        type: object
        propertyNames: { $ref: "#/definitions/word" }
        additionalProperties: { $ref: "#/definitions/command" }
        required: [reassess, open]
      unique-prefix-runs: { type: boolean }
      trailing-punctuation:
        type: string
        pattern: ^[.,;:!?]+$
      skill-commands:
        type: array
        items: { $ref: "#/definitions/slug" }
        uniqueItems: true
  skill:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { $ref: "#/definitions/slug" }
  reference:
    type: object
    additionalProperties: false
    required: [turn-id, letters, turn-after, separators]
    properties:
      turn-after:
        type: array
        items: { $ref: "#/definitions/word" }
        minItems: 1
        uniqueItems: true
      separators:
        type: array
        items: { type: string, pattern: "^[^\\sA-Za-z0-9.:]$" }
        minItems: 1
        uniqueItems: true
      turn-id:
        type: object
        additionalProperties: false
        required: [length, shortest, alphabet]
        properties:
          length: { type: integer, minimum: 1 }
          shortest: { type: integer, minimum: 1 }
          alphabet:
            type: string
            pattern: ^[0-9a-z]+$
      letters:
        type: object
        additionalProperties: false
        required: [first, last]
        properties:
          first: { $ref: "#/definitions/letter" }
          last: { $ref: "#/definitions/letter" }
  frees:
    type: object
    additionalProperties: false
    required: [label, separator]
    properties:
      label: { $ref: "#/definitions/name" }
      # One punctuation character, so no turn id, list or number holds it.
      separator:
        type: string
        pattern: ^[,;/]$
  subject:
    type: object
    additionalProperties: false
    required: [alphabet, words-kept, stop-words, entry, branch]
    properties:
      # Lowercase letters and digits, since a summary is lowercased before
      # its words are read.
      alphabet:
        type: string
        pattern: ^[0-9a-z]+$
      words-kept: { type: integer, minimum: 1 }
      stop-words:
        type: array
        items: { $ref: "#/definitions/word" }
        uniqueItems: true
      entry:
        type: object
        additionalProperties: false
        required: [label, words, digits]
        properties:
          label: { $ref: "#/definitions/word" }
          words:
            type: array
            items: { $ref: "#/definitions/word" }
            minItems: 1
            uniqueItems: true
          digits:
            type: object
            additionalProperties: false
            required: [fewest, most]
            properties:
              fewest: { type: integer, minimum: 1 }
              most: { type: integer, minimum: 1 }
      branch:
        type: object
        additionalProperties: false
        required: [label, separator, fewest-words]
        properties:
          label: { $ref: "#/definitions/word" }
          # A hyphen or an underscore, so no word of the alphabet holds it,
          # and a name a report goes by still reads as a whole word before
          # a sentence's full stop or beside a path's slash.
          separator:
            type: string
            pattern: ^[-_]$
          # Two or more, or a single word would be a branch name.
          fewest-words: { type: integer, minimum: 2 }
  roll-up:
    type: object
    additionalProperties: false
    required: [glyph, header, count-label, count-separator, interval]
    properties:
      interval:
        type: object
        additionalProperties: false
        required: [most-minutes, times, turns]
        properties:
          most-minutes: { type: integer, minimum: 1 }
          times: { type: integer, minimum: 1 }
          turns: { type: integer, minimum: 1 }
      glyph: { $ref: "#/definitions/glyph" }
      header: { $ref: "#/definitions/name" }
      count-label: { $ref: "#/definitions/name" }
      count-separator: { type: string, minLength: 1 }
  tag:
    type: object
    additionalProperties: false
    required: [glyph, digits, minus]
    properties:
      glyph: { $ref: "#/definitions/glyph" }
      digits:
        type: string
        minLength: 10
        maxLength: 10
      minus: { type: string, minLength: 1, maxLength: 1 }
  characters:
    type: object
    additionalProperties: false
    required: [header-underline, roll-up-underline, topic-underline, separator]
    properties:
      header-underline: { type: string, minLength: 1, maxLength: 1 }
      roll-up-underline: { type: string, minLength: 1, maxLength: 1 }
      topic-underline: { type: string, minLength: 1, maxLength: 1 }
      separator: { type: string, minLength: 1, maxLength: 1 }
