# The kanban turn-response protocol's checkable rules: the same for every
# user, so no settings file overrides them. tools/spec/compile.ts reads this
# file under YAML 1.2's core schema, checks it against kanban.schema.yaml
# and for consistency, and writes src/protocol/spec.ts, the module the core reads,
# and kanban.json, a copy for readers that aren't TypeScript. After a change
# here, run `spec-build` and commit all three; `nix flake check` fails while
# they differ.

# The lists a final response prints, in the order it prints them; a key is
# the list's name in code.
#   header: its name as its header writes it, `🧠 **Decide:**`, and as an
#     item's reference names it, `Decide.2`;
#   glyph: what its header opens with, and what the count line counts it by;
#   aliases: the names older replies in a transcript still carry;
#   rolls-up: whether its items roll up under 📌 until something settles them;
#   settled-by: what settles an item of it, besides a later `reassess` turn,
#     which settles every list's; it decides which items the 📌 roll-up and
#     the count line still carry, and is apart from settling-words, which a
#     prompt writes after an item's reference:
#     answer: the user's answer to its latest restatement, by an option
#       letter or in words; only Decide's items take an answer. A Decide
#       item a `kanban_options` call raised is also settled, superseded, by
#       a later item that names it in its `supersedes`, or, where that later
#       item gives no `supersedes`, by one on its subject; an answer to it
#       still settles it as answered;
#     merged-pull-request: every pull request it names with its repository,
#       as a GitHub URL or `owner/repo#N`, having merged; a bare `#N` is
#       never looked up, so an item naming only that never settles;
#     report: a report naming it, in a turn after the last that printed it
#       in its own list;
#     settling-word: one of its list's settling-words, which the user's own
#       text gives the latest printing of its subject in its own list, by
#       reference; a note alone settles nothing;
#     none: nothing; a list that doesn't roll up is settled by none, since
#       none of its items stays open to settle;
#   settling-words: each word that, after an item's reference, settles it,
#     with what it does; a word settles every list it's on the same way.
#     The word stands alone after the reference's `: `, `Todo.3: done`, or
#     is followed by `: ` and a note, `Todo.3: done: rotated it yesterday`.
#     Any other text after `: ` is a note, which settles no item of a list
#     with settling words; a Decide item's note is an answer in words. A
#     word settles the item in the pane and under a reply, and, for a list
#     settled-by settling-word, in the 📌 roll-up and the count line.
lists:
  done:
    header: Done
    glyph: ✅
    aliases: []
    rolls-up: false
    settled-by: none
    settling-words: {}
  pending:
    header: Pending
    glyph: 🚧
    aliases: [Unfinished, Open]
    rolls-up: true
    settled-by: none
    settling-words: {}
  logged:
    header: Logged
    glyph: 📝
    aliases: []
    rolls-up: false
    settled-by: none
    settling-words: {}
  waiting:
    header: Waiting
    glyph: ⏳
    aliases: []
    rolls-up: true
    settled-by: report
    settling-words: {}
  answers:
    header: Answers
    glyph: ❓
    aliases: [Questions]
    rolls-up: false
    settled-by: none
    settling-words: {}
  authorizations:
    header: Authorizations
    glyph: 🔑
    aliases: []
    rolls-up: true
    settled-by: none
    settling-words: {}
  review:
    header: Review
    glyph: 🔍
    aliases: [To review]
    rolls-up: true
    settled-by: merged-pull-request
    settling-words: {}
  todo:
    header: Todo
    glyph: 👉
    aliases: [To do]
    rolls-up: true
    settled-by: settling-word
    settling-words:
      done: settles it, the person having done it
      skip: settles it, the person not doing it
  decide:
    header: Decide
    glyph: 🧠
    aliases: [Decisions, Blocked]
    rolls-up: true
    settled-by: answer
    settling-words: {}

# A Decide item's options.
#   pro, con: what opens the lines under an option for what it gains and
#     what it costs;
#   kinds: how many letters an item takes, by its kind, in the order the
#     agent's instructions name them:
#     picks: `one` letter, or `any` number of them;
#     glyph: what each option is drawn with;
#     letters: the letters the kind takes, each with its own glyph in place
#       of `glyph`; none for a kind that takes any letter the reference
#       grammar allows. `Y` and `N` are strings: YAML 1.2 types no letter;
#     taught: whether the agent's instructions teach the kind; one not
#       taught is still read in the replies that hold it.
options:
  pro: ➕
  con: ➖
  kinds:
    radio:
      picks: one
      glyph: 🔘
      letters: {}
      taught: true
    checkbox:
      picks: any
      glyph: 🔲
      letters: {}
      taught: true
    # A yes-or-no question is taught as a radio item lettered A and B, so
    # every answer names an option one way; older replies still hold this.
    binary:
      picks: one
      glyph: 👍
      letters:
        Y: 👍
        N: 👎
      taught: false

# The commands a prompt runs, by its first word, bare or after a skill
# command.
#   names: each command, the name a draft writes first:
#     synonyms: its other names;
#     from-last-line: whether a prompt also runs it when its last line that
#       isn't blank is one of its names alone, after answers or news;
#   unique-prefix-runs: whether a prefix of a command's names that no other
#     command's name shares runs it, `reas` for `reassess`;
#   trailing-punctuation: the characters a command's word may end on;
#   skill-commands: the slash commands whose argument is the command.
commands:
  names:
    reassess:
      synonyms: [recheck, regenerate, recalculate]
      from-last-line: true
    open:
      synonyms: [pending, restate]
      from-last-line: false
  unique-prefix-runs: true
  trailing-punctuation: ".,;:!"
  skill-commands: [coding-agent-kanban-turn-responses, reply-block]

# The skill the plugin carries, derived from it.
#   name: its folder's name, the name its frontmatter gives, and the slash
#     command that loads it, bare or after the plugin's name and a colon,
#     `/coding-agent-kanban-turns:coding-agent-kanban-turn-responses`,
#     either of which a command may follow, as `skill-commands` may.
skill:
  name: coding-agent-kanban-turn-responses

# An item's reference, `<turn>.<List>.<n>[.<letters>][: note]`, the list
# being a list's header.
#   turn-id: the turn's id: `length` characters of `alphabet`, the first of
#     the prompt's id; a prefix of `shortest` characters or more names the
#     turn too;
#   letters: the range an option's capital letter is in, `first` to `last`;
#   turn-after: the words that name an answer's turn after it, `Decide.2: B
#     of 9efb08a1`;
#   separators: what may part one answer from the next on a line, spaces
#     around it, `Todo.1: done, Decide.2: B`. An answer's text after its
#     reference's colon, the spaces after the colon aside, runs to the next
#     reference of a list the pane draws, a separator before it aside.
reference:
  turn-id:
    length: 8
    shortest: 6
    alphabet: "0123456789abcdef"
  letters:
    first: A
    last: Z
  turn-after: [of, from]
  separators: [",", ";", "/"]

# The line an item that blocks other work ends on, naming the items it
# frees: `Frees: 0f311c94.Decide.2, 0f311c94.Review.1`. Each is an item's
# reference without letters or a note, `<turn>.<List>.<n>`, its turn always
# named, by an id or a prefix of one `reference.turn-id.shortest`
# characters long or more, the list being the header of a list that rolls
# up into 📌. It names an item of the turn whose reply printed the line, or
# of an earlier turn back to the latest `reassess` turn at or before it:
# a `reassess` turn's lists replace every earlier item, so a reference to
# an item one replaced frees nothing, and the line names the item that took
# it in instead. A prefix names the latest of those turns whose id opens on
# it and that holds the item. A reference to the item itself, or to no
# item of those turns, frees nothing.
#   label: the word the line opens with, before its colon;
#   separator: what parts its references, a space after it.
frees:
  label: Frees
  separator: ","

# An item's subject key, which matches it across rewordings of its summary:
# two items in one list with one key are one item, so a later item on a
# Decide item's subject settles it, unless that later item names the items
# it supersedes itself, and an answer to one answers the other.
# The first of these a summary holds gives its key: a backlog entry, then a
# branch-shaped code span, then its first words, then, where it holds no
# word, every letter and digit it holds, lowercased.
#   alphabet: the characters a word is made of, read from the summary
#     lowercased: a word is a run of them;
#   words-kept: how many words a key made of words keeps, the first that
#     aren't stop words, joined by a space: `Ship the release to users` is
#     keyed `ship release users`;
#   stop-words: the words a key made of words skips;
#   entry: a backlog entry the summary names, `entries 0550 and 0455`,
#     keyed `entry 0550`:
#     label: what the key opens with, before a space and the digits;
#     words: what names an entry, ignoring case, as a whole word;
#     digits: how many digits follow, `fewest` to `most`, as a whole word;
#   branch: the summary's first code span shaped like a branch name,
#     `atomic-reload`, keyed `branch atomic-reload`; a report that names
#     such a span of a Waiting item settles the item:
#     label: what the key opens with, before a space and the span;
#     separator: what joins a branch name's words; a name a report goes by
#       is matched as a whole word that may hold it too;
#     fewest-words: how many words, or more, a branch name joins.
#   The labels only keep the kinds of key apart, so an entry's key and a
#   branch's never match.
subject:
  alphabet: "0123456789abcdefghijklmnopqrstuvwxyz"
  words-kept: 3
  stop-words:
    [a, an, and, at, by, for, from, in, is, its, of, on, the, to, with]
  entry:
    label: entry
    words: [entry, entries]
    digits:
      fewest: 3
      most: 4
  branch:
    label: branch
    separator: "-"
    fewest-words: 2

# What earlier turns left open, which a final response closes on.
#   glyph: what the roll-up's header and its count line open with;
#   header: the full roll-up's header, `📌 **Outstanding from previous
#     turns:**`;
#   aliases: the headers older replies opened their roll-up with;
#   count-label: the word the count line names it by, `📌 Outstanding: …`;
#   count-separator: what parts the count line's lists;
#   interval: when the full roll-up is due, once min(`most-minutes` min,
#     `times` × the average duration of the last `turns` completed turns)
#     has passed since the last final response that printed it in full.
roll-up:
  glyph: 📌
  header: Outstanding from previous turns
  aliases: [Still open from earlier]
  count-label: Outstanding
  count-separator: " · "
  interval:
    most-minutes: 30
    times: 5
    turns: 5

# The 🔖 tag a 📌 item ends on, `🔖 0f311c94₋₃`: the glyph, then the turn id
# and its index counting back from the latest turn, in subscript.
#   digits: the subscript digits, 0 to 9;
#   minus: the subscript minus sign.
tag:
  glyph: 🔖
  digits: ₀₁₂₃₄₅₆₇₈₉
  minus: ₋

# The characters a final response is drawn with, each repeated once per
# column where it underlines.
#   header-underline: under a list's header;
#   roll-up-underline: under the full roll-up's header;
#   topic-underline: under a topic header, in a reply grouped by topic;
#   separator: alone on the line parting multi-line items, U+2800.
characters:
  header-underline: ▔
  roll-up-underline: ━
  topic-underline: ═
  separator: "⠀"
