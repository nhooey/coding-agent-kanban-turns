title: >-
  A draft the pane's Submit sent, its answers then a `reassess` line, runs
  `reassess`: the item it answers isn't asked again, and the rechecking
  turn's lists, the other item worked out afresh among them, replace every
  earlier item
turns:
  - id: 2a4c6e80
    prompt: Bump the lock and tag the release.
    replies:
      - text: "\
          The lock bump is under way.\n\
          \n\
          🚧 **Pending:**  \n\
          ▔▔▔▔▔▔▔▔▔▔▔\n\
          1. **Bump the lock**  \n\
          \   The build runs against the new libraries.\n\
          \n\
          🧠 **Decide:**  \n\
          ▔▔▔▔▔▔▔▔▔▔\n\
          1. **Who signs the release tag**  \n\
          \   🔘 A. **The release bot**: its SSH key.\n\
          \      ➕ No prompt.\n\
          \      ➖ A key to rotate.\n\
          \   🔘 B. **You**: your SSH key.\n\
          \      ➕ A person stands behind it.\n\
          \      ➖ A 1Password prompt.\n\
          \   ⠀\n\
          2. **The release's announcement**  \n\
          \   🔘 A. **A pull request comment**: on the merged pull request.\n\
          \      ➕ Where reviewers look.\n\
          \      ➖ Few read it.\n\
          \   🔘 B. **The README's top line**: a line of its own.\n\
          \      ➕ Every reader sees it.\n\
          \      ➖ It goes stale.\n"
        lint: []
    decide:
      - number: 1
        summary: Who signs the release tag
        kind: radio
        options:
          - { letter: A, name: The release bot }
          - { letter: B, name: You }
      - number: 2
        summary: The release's announcement
        kind: radio
        options:
          - { letter: A, name: A pull request comment }
          - { letter: B, name: "The README's top line" }
  - id: 3b5d7f91
    owner: this-plugin
    prompt: |-
      coding-agent-kanban-turns:
      2a4c6e80.Decide.1.A
      reassess
    runs: reassess
    replies:
      - text: "\
          ✅ **Done:**  \n\
          ▔▔▔▔▔▔▔▔\n\
          1. **The release bot signs the tag**\n\
          \n\
          🚧 **Pending:**  \n\
          ▔▔▔▔▔▔▔▔▔▔▔\n\
          1. **Bump the lock**  \n\
          \   The build is green on the new libraries.\n\
          \n\
          🧠 **Decide:**  \n\
          ▔▔▔▔▔▔▔▔▔▔\n\
          1. **The release's announcement**  \n\
          \   The README's top line is taken by the build badge since the lock bump.\n\
          \   🔘 A. **A pull request comment**: on the merged pull request.\n\
          \      ➕ Where reviewers look.\n\
          \      ➖ Few read it.\n\
          \   🔘 B. **A CHANGELOG entry**: a file of its own.\n\
          \      ➕ The usual place.\n\
          \      ➖ One more file.\n"
        lint: []
    decide:
      - number: 1
        summary: The release's announcement
        kind: radio
        options:
          - { letter: A, name: A pull request comment }
          - { letter: B, name: A CHANGELOG entry }
expect:
  open: [3b5d7f91.Decide.1]
  outstanding:
    - "Pending: Bump the lock"
    - "Decide: The release's announcement"
  counts: "📌 Outstanding: 🚧 1 · 🧠 1"
