  later turn's item, a number its list doesn't print, a list that doesn't
  roll up, a list the reply doesn't print, no turn, an unknown turn, a
  prefix shorter than the spec's shortest, the item itself, and one item
  twice; a line that isn't its item's last, one after a separator and one
  after a blank line. A Review item's line under its summary alone is no
  part of its text, so the pull request it names, though merged, settles
  nothing
