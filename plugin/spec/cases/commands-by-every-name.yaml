title: >-
  Each name of each command runs it, as the prompt's first word, as a prefix
  no other command shares, or after the skill's slash command; a `reassess`
  turn's lists replace every earlier item, and it prints no 📌; an `open`
  turn reprints the open Decide item as written and replaces nothing; and a
  peer's `reassess` runs nothing
turns:
  - id: 6d0f1154
    prompt: Start on the loader.
    replies:
      - text: "\
          The loader reads its cache twice.\n\
          \n\
          🚧 **Pending:**  \n\
          ▔▔▔▔▔▔▔▔▔▔▔\n\
          1. **Rework the loader**  \n\
          \   It reads the cache twice.\n\
          \n\
          🧠 **Decide:**  \n\
          ▔▔▔▔▔▔▔▔▔▔\n\
          1. **Which cache to keep for the loader**  \n\
          \   🔘 A. **Keep the disk cache**: it survives restarts.\n\
          \      ➕ Faster cold starts.\n\
          \      ➖ Disk use.\n\
          \   🔘 B. **Keep the memory cache**: simpler.\n\
          \      ➕ Less code.\n\
          \      ➖ Slow cold starts.\n"
        lint: []
    decide:
      - number: 1
        summary: Which cache to keep for the loader
        kind: radio
        options:
          - { letter: A, name: Keep the disk cache }
          - { letter: B, name: Keep the memory cache }
