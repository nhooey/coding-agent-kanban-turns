title: >-
  The plugin's own skill command, the plugin's name, a colon and the
  skill's, runs the command after it, typed or as the command record Claude
  Code leaves: a typed `reassess` replaces every earlier item, and an
  `open` sent as a command record reprints the open Decide item and
  replaces nothing
turns:
  - id: 3a4b5c6d
    prompt: Start on the loader.
    replies:
      - text: "\
          The loader reads its cache twice.\n\
          \n\
          🚧 **Pending:**  \n\
          ▔▔▔▔▔▔▔▔▔▔▔\n\
          1. **Rework the loader**  \n\
          \   It reads the cache twice.\n\
          \n\
          🧠 **Decide:**  \n\
          ▔▔▔▔▔▔▔▔▔▔\n\
          1. **Which cache to keep for the loader**  \n\
          \   🔘 A. **Keep the disk cache**: it survives restarts.\n\
          \      ➕ Faster cold starts.\n\
          \      ➖ Disk use.\n\
          \   🔘 B. **Keep the memory cache**: simpler.\n\
          \      ➕ Less code.\n\
          \      ➖ Slow cold starts.\n"
        lint: []
    decide:
      - number: 1
        summary: Which cache to keep for the loader
        kind: radio
        options:
          - { letter: A, name: Keep the disk cache }
          - { letter: B, name: Keep the memory cache }
  - id: 4b5c6d7e
    prompt: /coding-agent-kanban-turns:coding-agent-kanban-turn-responses reassess
    runs: reassess
    replies:
