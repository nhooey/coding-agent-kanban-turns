          \   🔘 A. **Keep the disk cache**: it survives restarts.\n\
          \      ➕ Faster cold starts.\n\
          \      ➖ Disk use.\n\
          \   🔘 B. **Keep the memory cache**: simpler.\n\
          \      ➕ Less code.\n\
          \      ➖ Slow cold starts.\n"
