title: >-
  A Todo settling word with a note after it, `done: <note>`, settles its
  item, as does a word written in capitals, `SKIP`; a note that only
  mentions a word, `skipping it for now`, settles nothing, so its item stays
  in the 📌 roll-up and the count line
turns:
  - id: 9efb08a1
    prompt: What's left for the release?
    replies:
      - text: "\
          The release builds; 3 things are yours to do.\n\
          \n\
          👉 **Todo:**  \n\
          ▔▔▔▔▔▔▔▔\n\
          1. **Rotate the deploy token**  \n\
          \   It expires on Friday.\n\
          \   ⠀\n\
          2. **Announce the release in the channel**\n\
          3. **Check the staging dashboard**\n"
        lint: []
  - id: b2c3d4e5
    prompt: |-
      9efb08a1.Todo.1: done: rotated it this morning
      Todo.2: SKIP
      Todo.3: skipping it for now
    replies:
      - text: "\
          Noted: the token is rotated and the announcement is off.\n\
          \n\
          📌 Outstanding: 👉 1\n"
        lint: []
expect:
  open: []
  outstanding:
    - "Todo: Check the staging dashboard"
  counts: "📌 Outstanding: 👉 1"
